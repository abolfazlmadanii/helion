name: CI

on:
  push:
    branches: [main, week2-python-port]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python 3.12 (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: PyFlink runtime (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --all-extras --dev
      - run: uv run ruff check
      - run: uv run pytest

  flink-next:
    name: PyFlink 2.3.0 (allowed failure)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: PyFlink runtime (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: uv sync --all-extras --dev
      - run: uv pip install "apache-flink==2.3.0"
      - run: uv run pytest
