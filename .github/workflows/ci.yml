name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  java-flink-2-2:
    name: Maven build (JDK 17, Flink 2.2.1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      # Builds helion-core, helion-flink and helion-kafka-streams (root pom modules) and runs JUnit 5 tests.
      - run: mvn -B -ntp verify

  java-flink-2-3:
    name: Maven build (JDK 17, Flink 2.3.0 best-effort)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: mvn -B -ntp verify -Dflink.version=2.3.0

  python-reference:
    name: Reference Python (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # pyproject: requires-python >=3.11
      - run: pip install -e '.[dev]'
      - run: pytest -q
