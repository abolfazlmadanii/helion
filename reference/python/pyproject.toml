[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "helion"
version = "0.1.0"
description = "Proven-error streaming sketches for hot-key detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["helion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
